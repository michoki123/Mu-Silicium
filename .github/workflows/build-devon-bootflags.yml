name: Build UEFI devon (bootflags)
on:
  workflow_dispatch:
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bf1, early: 1, mot: 0 }
          - { name: bf2, early: 2, mot: 1 }
    steps:
      - uses: actions/checkout@v7
      - name: Configurar variante (PmicDxe original + modulos Motorola ANTES del PMIC + pausa en errores)
        run: |
          f=Platforms/Motorola/devonPkg/devon.dsc
          set_flag() { sed -i -E "s/(^[[:space:]]*$1[[:space:]]*=[[:space:]]*)[0-9]+/\1$2/" $f; }
          set_flag SWAP_PMIC 1
          set_flag MOT_EARLY ${{ matrix.early }}
          set_flag ADD_MOT ${{ matrix.mot }}
          set_flag PAUSE_LOG 1
          grep -n -E "SWAP_|DROP_|ADD_|I2C_MODE|PAUSE_LOG|MOT_EARLY" $f
      - name: Build
        run: bash ./setup_env.sh -p apt && python3 build_uefi.py -d devon -r DEBUG
      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: uefi-devon-${{ matrix.name }}
          path: ./Mu-*
