name: Build UEFI devon (i2c)
on:
  workflow_dispatch:
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i2c-ro,  mode: 1 }
          - { name: i2c-otg, mode: 2 }
    steps:
      - uses: actions/checkout@v7
      - name: Configurar variante (sin PmicDxe + sonda I2C)
        run: |
          f=Platforms/Motorola/devonPkg/devon.dsc
          set_flag() { sed -i -E "s/(^[[:space:]]*$1[[:space:]]*=[[:space:]]*)[0-9]+/\1$2/" $f; }
          set_flag SWAP_PMIC 2
          set_flag I2C_MODE ${{ matrix.mode }}
          grep -n -E "SWAP_|DROP_|ADD_|I2C_MODE" $f
      - name: Build
        run: bash ./setup_env.sh -p apt && python3 build_uefi.py -d devon -r DEBUG
      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: uefi-devon-${{ matrix.name }}
          path: ./Mu-*
