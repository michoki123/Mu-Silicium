name: Build UEFI devon (otg)
on:
  workflow_dispatch:
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: otg-devon, usb: 1 }
          - { name: otg-spes,  usb: 0 }
    steps:
      - uses: actions/checkout@v7
      - name: Configurar variante (base adc-none + xHCI + OTG con reafirmacion periodica)
        run: |
          f=Platforms/Motorola/devonPkg/devon.dsc
          set_flag() { sed -i -E "s/(^[[:space:]]*$1[[:space:]]*=[[:space:]]*)[0-9]+/\1$2/" $f; }
          set_flag SWAP_PMIC 1
          set_flag MOT_EARLY 3
          set_flag ADD_MOT 1
          set_flag SWAP_ADC 2
          set_flag ADD_XHCI 1
          set_flag I2C_MODE 2
          set_flag PAUSE_LOG 2
          set_flag SWAP_USB ${{ matrix.usb }}
          grep -n -E "SWAP_|DROP_|ADD_|I2C_MODE|PAUSE_LOG|MOT_EARLY" $f
      - name: Build
        run: bash ./setup_env.sh -p apt && python3 build_uefi.py -d devon -r DEBUG
      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: uefi-devon-${{ matrix.name }}
          path: ./Mu-*
